pluginManagement {
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
}

// Holt automatisch ein JDK 8 — 1.8.9 startet der Launcher mit Java 8,
// also muss auch der Mod-Bytecode Java 8 sein.
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'visuals-fabric-189'
