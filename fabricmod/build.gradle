plugins {
    id 'fabric-loom' version '1.17.20'
}

version = '1.0.0'
group = 'dev.visual'

// Zielversion per -PmcVer=1.21.4 wählbar. Nur die wenigen Klassen mit
// abweichender API liegen unter src/compat/<version>/java, der Rest ist
// gemeinsam.
def mcVer = project.findProperty('mcVer') ?: '1.21.9'
def versions = [
        '1.21.2': [yarn: '1.21.2+build.1', api: '0.106.1+1.21.2', compat: '1.21.4', depends: '1.21.2'],
        '1.21.3': [yarn: '1.21.3+build.2', api: '0.114.1+1.21.3', compat: '1.21.4', depends: '1.21.3'],
        '1.21.4': [yarn: '1.21.4+build.8', api: '0.119.4+1.21.4', compat: '1.21.4', depends: '1.21.4'],
        '1.21.5': [yarn: '1.21.5+build.1', api: '0.128.2+1.21.5', compat: '1.21.5', depends: '1.21.5'],
        '1.21.6': [yarn: '1.21.6+build.1', api: '0.128.2+1.21.6', compat: '1.21.6', depends: '1.21.6'],
        '1.21.7': [yarn: '1.21.7+build.8', api: '0.129.0+1.21.7', compat: '1.21.6', depends: '1.21.7'],
        '1.21.8': [yarn: '1.21.8+build.1', api: '0.136.1+1.21.8', compat: '1.21.6', depends: '1.21.8'],
        '1.21.9': [yarn: '1.21.9+build.1', api: '0.134.1+1.21.9', compat: '1.21.9', depends: '1.21.9'],
        '1.21.10': [yarn: '1.21.10+build.3', api: '0.138.4+1.21.10', compat: '1.21.11', depends: '1.21.10'],
        '1.21.11': [yarn: '1.21.11+build.6', api: '0.141.6+1.21.11', compat: '1.21.11', depends: '1.21.11']
]
def cfg = versions[mcVer]
if (cfg == null) throw new GradleException("Unbekannte mcVer: ${mcVer} (bekannt: ${versions.keySet()})")

base {
    archivesName = "visuals-fabric-${mcVer}"
}

sourceSets.main.java.srcDir "src/compat/${cfg.compat}/java"

// OneConfig (Polyfrost) liefert das Menue, das wir wollen. Es ist LGPL-3.0
// mit Zusatzbedingungen - Einbinden ist genau der Fall, fuer den die LGPL
// gemacht ist, im Gegensatz zum Abschreiben der 1284 Klassen.
def oneconfig = project.findProperty('oneconfig') ?: ''

repositories {
    maven {
        name = 'Polyfrost'
        url = 'https://repo.polyfrost.org/releases'
    }
    // OneConfig 1.2 zieht JetBrains Compose und androidx nach; die liegen
    // nicht bei Polyfrost, sondern in diesen Quellen.
    mavenCentral()
    maven { url = 'https://maven.pkg.jetbrains.space/public/p/compose/dev' }
    maven { url = 'https://api.modrinth.com/maven' }
    google()
}

dependencies {
    minecraft "com.mojang:minecraft:${mcVer}"
    mappings "net.fabricmc:yarn:${cfg.yarn}:v2"
    modImplementation "net.fabricmc:fabric-loader:0.19.3"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${cfg.api}"
    if (oneconfig) {
        modCompileOnly "org.polyfrost.oneconfig:${oneconfig}:1.2.1"
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcDepends', cfg.depends
    filesMatching(['fabric.mod.json', 'visualsfabric.mixins.json']) {
        expand version: project.version, mcDepends: cfg.depends
    }
}
