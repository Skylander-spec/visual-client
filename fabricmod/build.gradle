plugins {
    id 'fabric-loom' version '1.17.21'
    // OneConfigs Menue ist Kotlin + Jetpack Compose. Wer seine Bausteine
    // aufrufen will, muss in derselben Sprache schreiben - deshalb Kotlin
    // und der Compose-Compiler hier, obwohl der Rest des Mods Java ist.
    id 'org.jetbrains.kotlin.jvm' version '2.4.20'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.20'
}

version = '1.0.0'
group = 'dev.visual'

// Zielversion per -PmcVer=1.21.4 wählbar. Nur die wenigen Klassen mit
// abweichender API liegen unter src/compat/<version>/java, der Rest ist
// gemeinsam.
def mcVer = project.findProperty('mcVer') ?: '1.21.9'
def versions = [
        '1.21.2': [yarn: '1.21.2+build.1', api: '0.106.1+1.21.2', compat: '1.21.2', depends: '1.21.2', oneconfig: '1.21.4-fabric'],
        '1.21.3': [yarn: '1.21.3+build.2', api: '0.114.1+1.21.3', compat: '1.21.2', depends: '1.21.3', oneconfig: '1.21.4-fabric'],
        '1.21.4': [yarn: '1.21.4+build.8', api: '0.119.4+1.21.4', compat: '1.21.4', depends: '1.21.4', oneconfig: '1.21.4-fabric'],
        '1.21.5': [yarn: '1.21.5+build.1', api: '0.128.2+1.21.5', compat: '1.21.5', depends: '1.21.5', oneconfig: '1.21.5-fabric'],
        '1.21.6': [yarn: '1.21.6+build.1', api: '0.128.2+1.21.6', compat: '1.21.6', depends: '1.21.6', oneconfig: '1.21.8-fabric'],
        '1.21.7': [yarn: '1.21.7+build.8', api: '0.129.0+1.21.7', compat: '1.21.6', depends: '1.21.7', oneconfig: '1.21.8-fabric'],
        '1.21.8': [yarn: '1.21.8+build.1', api: '0.136.1+1.21.8', compat: '1.21.6', depends: '1.21.8', oneconfig: '1.21.8-fabric'],
        '1.21.9': [yarn: '1.21.9+build.1', api: '0.134.1+1.21.9', compat: '1.21.9', depends: '1.21.9', oneconfig: '1.21.10-fabric'],
        '1.21.10': [yarn: '1.21.10+build.3', api: '0.138.4+1.21.10', compat: '1.21.11', depends: '1.21.10', oneconfig: '1.21.10-fabric'],
        '1.21.11': [yarn: '1.21.11+build.6', api: '0.141.6+1.21.11', compat: '1.21.11', depends: '1.21.11', oneconfig: '1.21.11-fabric']
]
def cfg = versions[mcVer]
if (cfg == null) throw new GradleException("Unbekannte mcVer: ${mcVer} (bekannt: ${versions.keySet()})")

base {
    archivesName = "visuals-fabric-${mcVer}"
}

sourceSets.main.java.srcDir "src/compat/${cfg.compat}/java"
sourceSets.main.kotlin.srcDir 'src/main/kotlin'

// OneConfig (Polyfrost) liefert das Menue, das wir wollen. Es ist LGPL-3.0
// mit Zusatzbedingungen - Einbinden ist genau der Fall, fuer den die LGPL
// gemacht ist, im Gegensatz zum Abschreiben der 1284 Klassen.
def oneconfig = cfg.oneconfig ?: ''

repositories {
    maven {
        name = 'Polyfrost'
        url = 'https://repo.polyfrost.org/releases'
    }
    // OneConfig 1.2 zieht JetBrains Compose und androidx nach; die liegen
    // nicht bei Polyfrost, sondern in diesen Quellen.
    mavenCentral()
    maven { url = 'https://maven.pkg.jetbrains.space/public/p/compose/dev' }
    maven { url = 'https://api.modrinth.com/maven' }
    google()
}

dependencies {
    minecraft "com.mojang:minecraft:${mcVer}"
    mappings "net.fabricmc:yarn:${cfg.yarn}:v2"
    modImplementation "net.fabricmc:fabric-loader:0.19.3"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${cfg.api}"
    if (oneconfig) {
        // Build-API 1.2.2; bestehende Profile enthalten auch OneConfig 1.0.x.
        // Factory und Screen-Lebenszyklus beruecksichtigen beide Fassungen.
        //
        // Bewusst compileOnly statt modCompileOnly: modCompileOnly schickt
        // das Jar durch Looms Remapper, und der scheitert an OneConfig 1.2.2
        // ("kotlinx-metadata-jvm cannot write metadata for future compiler
        // versions. Requested 2.4.0, highest known 2.3.0"). Remappen braucht
        // es hier auch gar nicht: wir rufen nur OneConfigs eigene Klassen
        // auf, und in deren Signaturen steht keine Minecraft-Klasse.
        modCompileOnly "org.polyfrost.oneconfig:${oneconfig}:1.2.2"
        compileOnly 'org.jetbrains.compose.runtime:runtime-desktop:1.12.0'
        compileOnly 'org.jetbrains.compose.foundation:foundation-desktop:1.12.0'
        compileOnly 'org.jetbrains.compose.ui:ui-desktop:1.12.0'
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

kotlin {
    jvmToolchain(21)
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcDepends', cfg.depends
    filesMatching(['fabric.mod.json', 'visualsfabric.mixins.json']) {
        expand version: project.version, mcDepends: cfg.depends
    }
}
